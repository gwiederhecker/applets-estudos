<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viagem no tempo da cidadania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EAF3FF; --paper:#FFFFFF; --ink:#1E2A4A; --soft:#56648A; --line:#D0DCF2;
  --primary:#3346A8; --primary-ink:#FFFFFF; --gold:#C98A00;
  --mint:#21A58C; --coral:#E5534E; --good-bg:#DDF6EF; --bad-bg:#FDE3E2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111833; --paper:#1C2549; --ink:#EEF2FF; --soft:#AEB8DA; --line:#2F3B6B;
    --primary:#93A3FF; --primary-ink:#111833; --gold:#FFC23D;
    --mint:#45CDB2; --coral:#FF7C77; --good-bg:#15443B; --bad-bg:#4B2332;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111833; --paper:#1C2549; --ink:#EEF2FF; --soft:#AEB8DA; --line:#2F3B6B;
  --primary:#93A3FF; --primary-ink:#111833; --gold:#FFC23D;
  --mint:#45CDB2; --coral:#FF7C77; --good-bg:#15443B; --bad-bg:#4B2332;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Nunito,"Trebuchet MS",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;line-height:1.08;margin:0;font-weight:800}
button{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;min-height:60px}
.brand{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:19px}
.score{font-weight:800;font-size:18px;color:var(--ink);background:var(--paper);border-radius:999px;padding:6px 14px;white-space:nowrap}
.score span{color:var(--gold)}
.back{background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;min-height:44px}

main{max-width:680px;margin:0 auto;padding:16px 16px 56px}
.btn{border:0;border-radius:16px;padding:14px 18px;background:var(--primary);color:var(--primary-ink);font-weight:800;font-size:17px;cursor:pointer;min-height:52px}
.btn.ghost{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 2px var(--primary)}
.btn:disabled{opacity:.4;cursor:default}

/* Início */
.hero{border-radius:28px;overflow:hidden;line-height:0}
.hero svg{width:100%;height:auto;display:block}
.home h1{font-size:clamp(32px,8.5vw,48px);margin:20px 0 8px}
.lead{color:var(--soft);margin:0 0 22px;max-width:36em}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.door{all:unset;box-sizing:border-box;cursor:pointer;border-radius:22px;padding:16px;color:#1E2A4A;display:flex;flex-direction:column;gap:6px;min-height:168px;position:relative}
.door:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.door.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;min-height:0}
.door .ic{line-height:0}
.door .ic svg{width:56px;height:56px}
.door b{font-family:"Baloo 2",system-ui,sans-serif;font-size:22px;line-height:1.05}
.door small{font-size:15px;line-height:1.35}
.door .st{margin-top:auto;font-weight:800;font-size:15px}
.d1{background:#FFC94F}.d2{background:#8ADBC8}.d3{background:#FFB8B2}.d4{background:#BFC9FF}.d5{background:#FFDDA6}

/* Paradas */
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-weight:800;font-size:15px;cursor:pointer}
.dot.done{background:var(--mint);border-color:var(--mint);color:#fff}
.dot.cur{box-shadow:0 0 0 3px var(--primary)}
.art{border-radius:24px;overflow:hidden;line-height:0}
.art svg{width:100%;height:auto;display:block}
.era{display:inline-block;margin:16px 0 6px;padding:4px 12px;border-radius:999px;background:var(--paper);color:var(--soft);font-weight:800;font-size:14px}
.stop h2{font-size:clamp(28px,7vw,36px);margin:2px 0 14px}
.facts{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:10px}
.facts li{background:var(--paper);border-radius:16px;padding:12px 14px 12px 46px;position:relative}
.facts li::before{content:"";position:absolute;left:16px;top:17px;width:16px;height:16px;border-radius:5px;transform:rotate(45deg);background:var(--c,#FFC94F)}
.key{background:#FFC94F;color:#1E2A4A;border-radius:16px;padding:12px 16px;font-weight:800;margin:0}
.check{margin-top:18px;border:3px dashed var(--line);border-radius:20px;padding:16px}
.check h3{font-size:22px;margin-bottom:4px}
.check p.q{margin:0 0 12px;font-weight:700}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-weight:700;font-size:17px;line-height:1.35;cursor:pointer;min-height:52px}
.opt:disabled{cursor:default}
.opt.ok{background:var(--good-bg);border-color:var(--mint)}
.opt.no{background:var(--bad-bg);border-color:var(--coral)}
.fb{min-height:1.5em;margin:10px 0 0;font-weight:800}
.fb.good{color:var(--mint)}.fb.bad{color:var(--coral)}
.nav{display:flex;gap:10px;margin-top:20px}.nav .btn{flex:1}

/* Jogos */
.gamehead h2{font-size:clamp(28px,7vw,36px)}
.gamehead p{color:var(--soft);margin:4px 0 0}
.bar{height:14px;border-radius:999px;background:var(--line);overflow:hidden;margin:12px 0 16px}
.bar i{display:block;height:100%;background:var(--mint);width:0;transition:width .35s}
.qcard{background:var(--paper);border-radius:24px;padding:18px}
.qcard .count{color:var(--soft);font-weight:800;font-size:14px;margin:0 0 6px}
.qcard h3{font-size:24px;margin-bottom:14px;line-height:1.15}
.qcard .opt{background:var(--bg)}
.qcard .opt.ok{background:var(--good-bg)}.qcard .opt.no{background:var(--bad-bg)}
.explain{margin:12px 0 0;padding:12px 14px;border-radius:14px;background:var(--bg)}
.explain b{display:block;font-family:"Baloo 2",system-ui,sans-serif;font-size:20px}
.result{text-align:center;background:var(--paper);border-radius:28px;padding:28px 18px}
.result h2{font-size:34px}
.big-stars{font-size:60px;letter-spacing:8px;color:var(--gold);margin:6px 0;line-height:1.1}
.big-stars span{display:inline-block;animation:pop .5s backwards}
.big-stars span:nth-child(2){animation-delay:.15s}.big-stars span:nth-child(3){animation-delay:.3s}
.big-stars span.off{color:var(--line)}
@keyframes pop{from{transform:scale(0) rotate(-50deg)}}
.result .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.review{text-align:left;margin:18px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.review li{background:var(--bg);border-radius:14px;padding:10px 14px;font-size:15px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}60%{transform:translateX(7px)}}

.item-card{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:clamp(26px,7vw,34px);text-align:center;background:var(--paper);border-radius:24px;padding:30px 16px;margin-bottom:14px;line-height:1.1}
.buckets{display:grid;gap:10px}
.bucket{all:unset;box-sizing:border-box;cursor:pointer;border-radius:18px;padding:12px 16px;color:#1E2A4A;display:flex;align-items:center;gap:12px;min-height:64px}
.bucket:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.bucket svg{width:42px;height:42px;flex:none}
.bucket b{font-family:"Baloo 2",system-ui,sans-serif;font-size:21px;display:block;line-height:1.1}
.bucket small{font-size:14px}
.b-civil{background:#BFC9FF}.b-politico{background:#FFC94F}.b-social{background:#FFB8B2}

.tl{list-style:none;padding:0 0 0 24px;margin:0 0 18px 10px;border-left:4px solid var(--primary);min-height:20px}
.tl li{position:relative;margin:0 0 10px;background:var(--paper);border-radius:14px;padding:8px 12px;animation:slidein .3s}
.tl li::before{content:"";position:absolute;left:-35px;top:14px;width:18px;height:18px;border-radius:50%;background:var(--primary);border:4px solid var(--bg)}
.tl li b{font-family:"Baloo 2",system-ui,sans-serif;color:var(--primary);font-size:20px;margin-right:6px}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}}
.pool{display:grid;gap:8px}
.hint{color:var(--soft);font-weight:700;margin:0 0 10px}

.who{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.who svg{width:64px;height:64px;flex:none}
.who p{margin:0;font-family:"Baloo 2",system-ui,sans-serif;font-weight:600;font-size:21px;line-height:1.25}

@media (max-width:380px){.doors{grid-template-columns:1fr}.door{min-height:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="back" id="home-btn" type="button" hidden>Início</button>
    <span class="brand" id="brand">Viagem no tempo</span>
    <span class="score" aria-live="polite"><span>★</span> <b id="total">0</b></span>
  </div>
</header>

<main>
  <section data-view="inicio" class="home" id="v-inicio"></section>
  <section data-view="paradas" id="v-paradas" hidden></section>
  <section data-view="quiz" id="v-quiz" hidden></section>
  <section data-view="separar" id="v-separar" hidden></section>
  <section data-view="linha" id="v-linha" hidden></section>
  <section data-view="quem" id="v-quem" hidden></section>
</main>

{id:'cidadania', c:'#3346A8', era:'Hoje', title:'O que é cidadania?', art:'cidadania',
 facts:['Cidadania é o conjunto de direitos e deveres de uma pessoa no país onde ela vive.',
  'Direitos civis garantem a liberdade: ir e vir, falar o que pensa, escolher a religião, ter justiça.',
  'Direitos políticos garantem a participação: votar, ser candidato, entrar num partido.',

  'No Brasil, eles estão na Constituição de 1988 e em estatutos, como o ECA (1990), que protege crianças e adolescentes.'],

{id:'atenas', c:'#FFC23D', era:'Grécia Antiga, há mais de 2.500 anos', title:'Atenas: onde a cidadania nasceu', art:'atenas',
 facts:['As primeiras ideias de cidadania e a democracia surgiram em Atenas.',
  'Só eram cidadãos os homens livres nascidos em Atenas.',
  'Ficavam de fora: as mulheres, os metecos (estrangeiros que moravam lá) e os escravizados.',
  'Mulheres ricas ficavam dentro de casa, no gineceu. As pobres trabalhavam nos mercados, como vendedoras ou lavadeiras.',
  'Democracia direta: os cidadãos votavam tudo na Assembleia, umas 40 vezes por ano.',
  'Paideia: jovens de 7 a 16 anos aprendiam ginástica (na palestra e no ginásio), música com a lira, leitura e escrita.'],
 key:'O Brasil é uma democracia representativa: elegemos pessoas para decidir por nós.',

{id:'roma', c:'#C0392B', era:'Roma Antiga, a partir de 753 a.C.', title:'Roma: patrícios e plebeus', art:'roma',
 facts:['Patrícios eram os nobres donos de terras. No começo, só eles eram cidadãos e ocupavam o Senado.',
  'Plebeus eram camponeses, artesãos e comerciantes, chamados de populus, o povo.',
  'Havia também os clientes, que serviam aos patrícios, e os escravizados.',
  'Em 509 a.C., Roma virou uma república, palavra que quer dizer “coisa pública”.',
  'Os plebeus viraram soldados da legião, os legionários. Em troca, exigiram direitos: votar nas assembleias e nos plebiscitos.',

 q:'Como se chamavam os soldados romanos?', opts:['Legionários','Metecos','Patrícios']},
{id:'escravidao', c:'#6E7894', era:'Antiguidade e hoje', title:'Escravidão: ontem e hoje', art:'escravidao',
 facts:['Na Antiguidade, quem perdia uma guerra podia ser escravizado. Pessoas com dívidas também.',
  'Em Roma, a maioria trabalhava na agricultura e na mineração. A libertação se chamava alforria.',
  'Hoje a liberdade é um direito e o trabalho escravo é crime. No Brasil, é crime desde 2003.',
  'Ainda existe trabalho análogo (parecido) à escravidão: pessoas pobres presas por dívidas e trabalho humilhante.',
  'No gráfico do livro, 2008 teve mais resgates (1.456 pessoas) e 2016 teve menos (159).'],
 q:'Hoje, no Brasil, manter alguém em trabalho escravo é…', opts:['crime','permitido no campo','permitido se a pessoa tiver dívida']},
{id:'onu', c:'#4C9BE0', era:'1945 e 1948', title:'A ONU e os direitos humanos', art:'onu',
 facts:['Direitos humanos valem para todas as pessoas do mundo, de qualquer origem, cor, idade ou religião.',
  'A Segunda Guerra Mundial (1939 a 1945) deixou milhões de mortos, feridos e órfãos.',
  'Em 1945, 50 países, incluindo o Brasil, criaram a ONU para trabalhar pela paz.',
  'Em 10 de dezembro de 1948, a ONU fez a Declaração Universal dos Direitos Humanos, com 30 artigos.',
  'Ela diz, por exemplo, que todos nascem livres e iguais e que ninguém pode ser escravizado.'],
 q:'Por que a ONU foi criada?', opts:['Por causa da Segunda Guerra Mundial','Por causa da Revolução Francesa','Para acabar com a escravidão no Brasil']},
{id:'franca', c:'#8E7CC3', era:'França, 1789', title:'Revolução Francesa', art:'franca',
 facts:['1º estado: o clero (padres e bispos). Tinha muitos privilégios.',
  '2º estado: a nobreza. O rei tinha poder absoluto e dizia ser o próprio Estado.',
  '3º estado: a maioria do povo. Pagava impostos altos e não participava da política.',

  'O lema era liberdade, igualdade e fraternidade.',
  'A Declaração dos Direitos do Homem e do Cidadão (17 artigos) disse que o Estado é o povo, a nação, e não o rei.'],
 key:'Essas ideias inspiraram a Conjuração Mineira (1789) e a Conjuração Baiana (1798).',

{id:'haiti', c:'#21A58C', era:'Haiti, de 1794 a 1804', title:'Haiti: a primeira abolição', art:'haiti',

  'São Domingos, hoje Haiti, era uma colônia francesa rica em açúcar e café.',
  'De 558 mil moradores, 500 mil eram escravizados.',
  'Em 1794, a França declarou o fim da escravidão nas colônias.',
  'Em 1804, liderados por Toussaint Louverture, filho de escravizados, declararam a independência.'],
 key:'Primeiro país da América a abolir a escravidão: Haiti (1794). Último: Brasil (1888).',

{id:'brasil', c:'#E9C46A', era:'Brasil, de 1850 a 1888', title:'A abolição no Brasil', art:'brasil',
 facts:['1850, Lei Eusébio de Queirós: proibiu trazer africanos para o Brasil (o tráfico negreiro).',
  '1871, Lei do Ventre Livre: filhos de escravizadas passaram a nascer livres.',
  '1884: fim da escravidão no Ceará, no Amazonas e no Rio Grande do Sul.',
  '1885, Lei dos Sexagenários: ficavam livres os maiores de 60 anos.',
  '13 de maio de 1888, Lei Áurea: a princesa Isabel acabou com a escravidão no Brasil.',

{id:'chibata', c:'#4A5266', era:'Rio de Janeiro, de 1889 a 1910', title:'República e Revolta da Chibata', art:'chibata',
 facts:['Sem os escravizados, os fazendeiros deixaram de apoiar o imperador.',
  'Em 15 de novembro de 1889, Deodoro da Fonseca proclamou a República e virou o primeiro presidente.',
  'Os ex-escravizados ficaram sem moradia, escola, saúde e emprego. Muitos foram morar em cortiços.',
  'Na Marinha, marinheiros negros ainda levavam chibatadas (chicotadas) como castigo.',
  'Em 1910, João Cândido liderou 2.300 marinheiros: tomaram 5 navios e mandaram uma carta ao governo.',

{q:'Quantos anos Nelson Mandela ficou preso?', o:['27 anos','2 anos','60 anos','1 ano'], w:'De 1962 a 1990. Depois virou presidente da África do Sul.'}
];

const RIGHTS = [
['Liberdade religiosa','civil'],['Liberdade de expressão','civil'],['Ir e vir','civil'],['Direito à justiça','civil'],['Liberdade de pensamento','civil'],
['Votar','politico'],['Ser candidato','politico'],['Participar de partido político','politico'],['Propor leis','politico'],
['Saúde','social'],['Educação','social'],['Alimentação','social'],['Moradia','social'],['Lazer','social']
];
const BUCKETS = {civil:'Civil', politico:'Político', social:'Social'};

const EVENTS = [
[-753,'753 a.C.','Fundação de Roma'],[-509,'509 a.C.','Roma vira república'],[1789,'1789','Revolução Francesa'],
[1804,'1804','Independência do Haiti'],[1850,'1850','Lei Eusébio de Queirós'],[1871,'1871','Lei do Ventre Livre'],
[1888,'1888','Lei Áurea'],[1889,'1889','Proclamação da República'],[1910,'1910','Revolta da Chibata'],
[1945,'1945','Criação da ONU'],[1948,'1948','Declaração Universal dos Direitos Humanos'],[1955,'1955','Rosa Parks no ônibus'],
[1994,'1994','Mandela vira presidente'],[2003,'2003','Trabalho escravo vira crime no Brasil']
];

const PEOPLE = [
['Luiz Gama','Estudei sozinho, virei advogado sem diploma e libertei centenas de escravizados na Justiça.'],
['Castro Alves','Fui poeta e escrevi O navio negreiro, sobre o sofrimento na travessia do oceano.'],
['André Rebouças','Fui engenheiro, ajudei a fundar a Sociedade Brasileira contra a Escravidão e queria terras para os negros.'],
['Joaquim Nabuco','Como deputado federal, ajudei a organizar a campanha pelo fim da escravidão.'],
['José do Patrocínio','Estudei Farmácia, mas virei jornalista e fui um dos abolicionistas mais atuantes.'],
['Maria Firmina dos Reis','Fui professora e escrevi Úrsula, o primeiro romance brasileiro com personagens negros.'],
['Toussaint Louverture','Filho de escravizados, liderei a independência do Haiti em 1804.'],
['João Cândido','Marinheiro, liderei a Revolta da Chibata em 1910.'],
['Rosa Parks','Costureira, em 1955 não cedi meu lugar no ônibus em Montgomery.'],
['Martin Luther King','Pastor, lutei sem violência e organizei o boicote aos ônibus. Ganhei o Nobel em 1964.'],
['Nelson Mandela','Fiquei 27 anos preso por lutar contra o apartheid e depois virei presidente da África do Sul.'],
['Princesa Isabel','Em 13 de maio de 1888, assinei a Lei Áurea.'],
['Deodoro da Fonseca','Proclamei a República em 1889 e fui o primeiro presidente do Brasil.']
];

/* ---------- Estado ---------- */
const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function load(){ try { const s = JSON.parse(localStorage.getItem('viagem-tempo')); if (s && s.stops && s.best) return s; } catch(e){} return {stops:{}, best:{}}; }
const state = load();
function save(){ try { localStorage.setItem('viagem-tempo', JSON.stringify(state)); } catch(e){} }
function starsFor(pct){ return pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .5 ? 1 : 0; }
function setBest(game, n){ if ((state.best[game] || 0) < n) { state.best[game] = n; save(); } updateTotal(); }
function updateTotal(){
  const stops = Object.keys(state.stops).length;
  const games = ['quiz','separar','linha','quem'].reduce((s,g) => s + (state.best[g] || 0), 0);
  $('#total').textContent = stops + games;
}
function starRow(n){ return [0,1,2].map(i => `<span class="${i < n ? '' : 'off'}">★</span>`).join(''); }
function resultHTML(n, title, line, again){
  const msg = ['Vale tentar de novo!','Bom começo!','Muito bem!','Mandou muito bem!'][n];
  return `<div class="result"><div class="big-stars" aria-label="${n} de 3 estrelas">${starRow(n)}</div>
    <h2>${msg}</h2><p>${line}</p>
    <div class="row"><button class="btn" type="button" data-act="${again}">Jogar de novo</button>
    <button class="btn ghost" type="button" data-go="inicio">Voltar ao início</button></div>${title || ''}</div>`;
}

/* ---------- Início ---------- */
function renderHome(){
  const done = Object.keys(state.stops).length;
  const b = g => (state.best[g] || 0);
  const st = n => n ? `${'★'.repeat(n)}${'☆'.repeat(3-n)}` : 'Ainda não jogado';
  $('#v-inicio').innerHTML = `
    <div class="hero">${ART.hero}</div>
    <h1>Viagem no tempo da cidadania</h1>
    <p class="lead">Revisão de História para a prova: de Atenas até Nelson Mandela. Visite as paradas e depois teste o que aprendeu nos jogos.</p>
    <div class="doors">
      <button class="door wide d1" type="button" data-go="paradas"><span class="ic">${ICON.paradas}</span><span><b>Visitar as 10 paradas</b><br><small>Cada parada tem um desenho, o resumo e uma pergunta rápida.</small><br><span class="st">${done} de 10 paradas concluídas</span></span></button>
      <button class="door d2" type="button" data-go="quiz"><span class="ic">${ICON.quiz}</span><b>Quiz</b><small>10 perguntas sorteadas.</small><span class="st">${st(b('quiz'))}</span></button>
      <button class="door d3" type="button" data-go="separar"><span class="ic">${ICON.separar}</span><b>Separe os direitos</b><small>Civil, político ou social?</small><span class="st">${st(b('separar'))}</span></button>
      <button class="door d4" type="button" data-go="linha"><span class="ic">${ICON.linha}</span><b>Linha do tempo</b><small>Coloque os fatos em ordem.</small><span class="st">${st(b('linha'))}</span></button>
      <button class="door d5" type="button" data-go="quem"><span class="ic">${ICON.quem}</span><b>Quem sou eu?</b><small>Adivinhe o personagem.</small><span class="st">${st(b('quem'))}</span></button>
    </div>`;
}

/* ---------- Paradas ---------- */
let stopIdx = 0;
function renderStop(){
  const s = STOPS[stopIdx];
  const opts = shuffle(s.opts.map((t,i) => ({t, ok: i === 0})));
  $('#v-paradas').innerHTML = `
    <nav class="dots" aria-label="Paradas">${STOPS.map((x,i) => `<button type="button" class="dot ${state.stops[x.id] ? 'done' : ''} ${i === stopIdx ? 'cur' : ''}" data-stop="${i}" aria-label="Parada ${i+1}: ${x.title}" ${i === stopIdx ? 'aria-current="step"' : ''}>${i+1}</button>`).join('')}</nav>
    <article class="stop" style="--c:${s.c}">
      <div class="art">${ART[s.art]}</div>
      <p class="era">${s.era}</p>
      <h2>${s.title}</h2>
      <ul class="facts">${s.facts.map(f => `<li>${f}</li>`).join('')}</ul>
      ${s.key ? `<p class="key">${s.key}</p>` : ''}
      <div class="check">
        <h3>Pergunta rápida</h3>
        <p class="q">${s.q}</p>
        <div class="opts">${opts.map(o => `<button type="button" class="opt" data-ok="${o.ok}">${o.t}</button>`).join('')}</div>
        <p class="fb" aria-live="polite"></p>
      </div>
      <div class="nav">
        <button class="btn ghost" type="button" data-step="-1" ${stopIdx === 0 ? 'disabled' : ''}>Parada anterior</button>
        <button class="btn" type="button" data-step="1">${stopIdx === STOPS.length - 1 ? 'Ir para os jogos' : 'Próxima parada'}</button>
      </div>
    </article>`;
}
$('#v-paradas').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.stop) { stopIdx = +t.dataset.stop; renderStop(); scrollTo(0,0); return; }
  if (t.dataset.step) {
    const n = stopIdx + +t.dataset.step;
    if (n >= STOPS.length) { location.hash = 'inicio'; return; }
    stopIdx = Math.max(0, n); renderStop(); scrollTo(0,0); return;
  }
  if (t.classList.contains('opt') && !t.disabled) {
    const fb = $('#v-paradas .fb');
    if (t.dataset.ok === 'true') {
      t.classList.add('ok');
      document.querySelectorAll('#v-paradas .opt').forEach(b => b.disabled = true);
      fb.className = 'fb good'; fb.textContent = 'Acertou! Parada concluída.';
      state.stops[STOPS[stopIdx].id] = true; save(); updateTotal();
      document.querySelector(`#v-paradas .dot[data-stop="${stopIdx}"]`).classList.add('done');
    } else {
      t.classList.add('no','shake'); t.disabled = true;
      fb.className = 'fb bad'; fb.textContent = 'Quase! Releia os quadradinhos acima e tente outra.';
    }
  }
});

/* ---------- Quiz ---------- */
let qz;
function startQuiz(){ qz = {list: shuffle(QUIZ).slice(0,10), i:0, score:0, wrong:[]}; renderQ(); }
function renderQ(){
  const el = $('#v-quiz');
  if (qz.i >= qz.list.length) {
    const n = starsFor(qz.score / qz.list.length); setBest('quiz', n);
    const rev = qz.wrong.length ? `<ul class="review">${qz.wrong.map(w => `<li><b>${w.q}</b><br>Resposta: ${w.o[0]}</li>`).join('')}</ul>` : '';
    el.innerHTML = `<div class="gamehead"><h2>Quiz</h2></div><div style="height:14px"></div>` +
      resultHTML(n, rev ? `<p style="margin-top:20px;font-weight:800">Para revisar:</p>${rev}` : '', `Você acertou ${qz.score} de ${qz.list.length}.`, 'quiz');
    return;
  }
  const q = qz.list[qz.i];
  const opts = shuffle(q.o.map((t,i) => ({t, ok: i === 0})));
  el.innerHTML = `<div class="gamehead"><h2>Quiz</h2><p>Escolha a resposta certa.</p></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${qz.i}"><i style="width:${qz.i*10}%"></i></div>
    <div class="qcard"><p class="count">Pergunta ${qz.i+1} de ${qz.list.length}</p><h3>${q.q}</h3>
    <div class="opts">${opts.map(o => `<button type="button" class="opt" data-ok="${o.ok}">${o.t}</button>`).join('')}</div>
    <div class="explain-slot" aria-live="polite"></div></div>`;
}
$('#v-quiz').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.act === 'quiz') { startQuiz(); return; }
  if (t.dataset.next) { qz.i++; renderQ(); scrollTo(0,0); return; }
  if (t.classList.contains('opt') && !t.disabled) {
    const q = qz.list[qz.i], ok = t.dataset.ok === 'true';
    document.querySelectorAll('#v-quiz .opt').forEach(b => { b.disabled = true; if (b.dataset.ok === 'true') b.classList.add('ok'); });
    if (ok) qz.score++; else { t.classList.add('no','shake'); qz.wrong.push(q); }
    $('#v-quiz .explain-slot').innerHTML = `<div class="explain"><b style="color:${ok ? 'var(--mint)' : 'var(--coral)'}">${ok ? 'Isso!' : 'Quase!'}</b>${q.w}</div>
      <div class="nav"><button class="btn" type="button" data-next="1">${qz.i === qz.list.length - 1 ? 'Ver resultado' : 'Próxima pergunta'}</button></div>`;
  }
});

/* ---------- Separe os direitos ---------- */
let sp;
function startSep(){ sp = {list: shuffle(RIGHTS), i:0, score:0, tried:false}; renderSep(); }
function renderSep(){
  const el = $('#v-separar');
  if (sp.i >= sp.list.length) {
    const n = starsFor(sp.score / sp.list.length); setBest('separar', n);
    el.innerHTML = `<div class="gamehead"><h2>Separe os direitos</h2></div><div style="height:14px"></div>` +
      resultHTML(n, '', `Você acertou ${sp.score} de ${sp.list.length} na primeira tentativa.`, 'separar');
    return;
  }
  const [name] = sp.list[sp.i];
  el.innerHTML = `<div class="gamehead"><h2>Separe os direitos</h2><p>Este direito é civil, político ou social?</p></div>
    <div class="bar"><i style="width:${sp.i / sp.list.length * 100}%"></i></div>
    <div class="item-card">${name}</div>
    <div class="buckets">
      <button type="button" class="bucket b-civil" data-b="civil">${ICON.civil}<span><b>Civil</b><small>Liberdade</small></span></button>
      <button type="button" class="bucket b-politico" data-b="politico">${ICON.politico}<span><b>Político</b><small>Participar e votar</small></span></button>
      <button type="button" class="bucket b-social" data-b="social">${ICON.social}<span><b>Social</b><small>O Estado cuidando de todos</small></span></button>
    </div>
    <p class="fb" aria-live="polite"></p>`;
  sp.tried = false;
}
$('#v-separar').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.act === 'separar') { startSep(); return; }
  if (t.dataset.b) {
    const right = sp.list[sp.i][1], fb = $('#v-separar .fb'), card = $('#v-separar .item-card');
    if (t.dataset.b === right) {
      if (!sp.tried) sp.score++;
      fb.className = 'fb good'; fb.textContent = `Isso! É um direito ${BUCKETS[right].toLowerCase()}.`;
      document.querySelectorAll('#v-separar .bucket').forEach(b => b.style.pointerEvents = 'none');
      setTimeout(() => { sp.i++; renderSep(); }, 900);
    } else {
      sp.tried = true; card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      fb.className = 'fb bad'; fb.textContent = 'Não é esse. Lembre: civil é liberdade, político é voto, social é cuidado.';
    }
  }
});

/* ---------- Linha do tempo ---------- */
let ln;
function startLinha(){ const pick = shuffle(EVENTS).slice(0,7); ln = {pool: shuffle(pick), placed: [], miss:0}; renderLinha(); }
function renderLinha(){
  const el = $('#v-linha');
  if (!ln.pool.length) {
    const n = ln.miss === 0 ? 3 : ln.miss <= 2 ? 2 : ln.miss <= 4 ? 1 : 0; setBest('linha', n);
    el.innerHTML = `<div class="gamehead"><h2>Linha do tempo</h2></div><div style="height:14px"></div>
      <ol class="tl">${ln.placed.map(ev => `<li><b>${ev[1]}</b>${ev[2]}</li>`).join('')}</ol>` +
      resultHTML(n, '', ln.miss ? `Você errou ${ln.miss} ${ln.miss === 1 ? 'vez' : 'vezes'}.` : 'Sem nenhum erro!', 'linha');
    return;
  }
  el.innerHTML = `<div class="gamehead"><h2>Linha do tempo</h2><p>Toque nos fatos do mais antigo para o mais recente.</p></div>
    <div style="height:14px"></div>
    ${ln.placed.length ? `<ol class="tl">${ln.placed.map(ev => `<li><b>${ev[1]}</b>${ev[2]}</li>`).join('')}</ol>` : ''}
    <p class="hint">${ln.placed.length ? 'Qual veio depois?' : 'Qual aconteceu primeiro?'}</p>
    <div class="pool">${ln.pool.map((ev,i) => `<button type="button" class="opt" data-ev="${i}">${ev[2]}</button>`).join('')}</div>
    <p class="fb" aria-live="polite"></p>`;
}
$('#v-linha').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.act === 'linha') { startLinha(); return; }
  if (t.dataset.ev !== undefined) {
    const ev = ln.pool[+t.dataset.ev];
    const min = Math.min(...ln.pool.map(x => x[0]));
    if (ev[0] === min) { ln.placed.push(ev); ln.pool.splice(+t.dataset.ev, 1); renderLinha(); }
    else {
      ln.miss++; t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
      const fb = $('#v-linha .fb'); fb.className = 'fb bad'; fb.textContent = `“${ev[2]}” aconteceu em ${ev[1]}, mas tem outro fato mais antigo.`;
    }
  }
});

/* ---------- Quem sou eu ---------- */
let qm;
function startQuem(){ qm = {list: shuffle(PEOPLE).slice(0,8), i:0, score:0}; renderQuem(); }
function renderQuem(){
  const el = $('#v-quem');
  if (qm.i >= qm.list.length) {
    const n = starsFor(qm.score / qm.list.length); setBest('quem', n);
    el.innerHTML = `<div class="gamehead"><h2>Quem sou eu?</h2></div><div style="height:14px"></div>` +
      resultHTML(n, '', `Você acertou ${qm.score} de ${qm.list.length}.`, 'quem');
    return;
  }
  const [name, clue] = qm.list[qm.i];
  const others = shuffle(PEOPLE.filter(p => p[0] !== name)).slice(0,3).map(p => p[0]);
  const opts = shuffle([name, ...others]);
  el.innerHTML = `<div class="gamehead"><h2>Quem sou eu?</h2><p>Leia a pista e descubra o personagem.</p></div>
    <div class="bar"><i style="width:${qm.i / qm.list.length * 100}%"></i></div>
    <div class="qcard"><p class="count">Personagem ${qm.i+1} de ${qm.list.length}</p>
    <div class="who">${ICON.mystery}<p>“${clue}”</p></div>
    <div class="opts">${opts.map(o => `<button type="button" class="opt" data-ok="${o === name}">${o}</button>`).join('')}</div>
    <div class="explain-slot" aria-live="polite"></div></div>`;
}
$('#v-quem').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.act === 'quem') { startQuem(); return; }
  if (t.dataset.next) { qm.i++; renderQuem(); scrollTo(0,0); return; }
  if (t.classList.contains('opt') && !t.disabled) {
    const ok = t.dataset.ok === 'true', name = qm.list[qm.i][0];
    document.querySelectorAll('#v-quem .opt').forEach(b => { b.disabled = true; if (b.dataset.ok === 'true') b.classList.add('ok'); });
    if (ok) qm.score++; else t.classList.add('no','shake');
    $('#v-quem .explain-slot').innerHTML = `<div class="explain"><b style="color:${ok ? 'var(--mint)' : 'var(--coral)'}">${ok ? 'Acertou!' : 'Era ' + name + '.'}</b></div>
      <div class="nav"><button class="btn" type="button" data-next="1">${qm.i === qm.list.length - 1 ? 'Ver resultado' : 'Próximo personagem'}</button></div>`;
  }
});

/* ---------- Navegação ---------- */
const INIT = {inicio: renderHome, paradas: renderStop, quiz: startQuiz, separar: startSep, linha: startLinha, quem: startQuem};
const TITLES = {inicio:'Viagem no tempo', paradas:'As 10 paradas', quiz:'Quiz', separar:'Separe os direitos', linha:'Linha do tempo', quem:'Quem sou eu?'};
function route(){
  let v = location.hash.slice(1);
  if (!INIT[v]) v = 'inicio';
  document.querySelectorAll('[data-view]').forEach(s => s.hidden = s.dataset.view !== v);
  $('#home-btn').hidden = v === 'inicio';
  $('#brand').textContent = TITLES[v];
  INIT[v](); updateTotal(); window.scrollTo(0,0);
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { const v = g.dataset.go; if (location.hash.slice(1) === v) route(); else location.hash = v; }
});
$('#home-btn').addEventListener('click', () => { location.hash = 'inicio'; });
window.addEventListener('hashchange', route);
route();
</script>
<script src="../../assets/voltar.js" defer></script>
</body>
</html>
