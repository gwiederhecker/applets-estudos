<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Título do applet</title>
<style>
:root{ --bg:#F6F7FB; --card:#fff; --ink:#17213A; --muted:#5A6580; --line:#DDE2EE; color-scheme:light; }
@media (prefers-color-scheme: dark){ :root{ --bg:#121722; --card:#1A2130; --ink:#E9EDF5; --muted:#A3ADC2; --line:#2C3547; color-scheme:dark; } }
body{ margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
.wrap{ max-width:960px; margin:0 auto; padding:24px 16px 72px; }
.panel{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Título do applet</h1>
  <p style="color:var(--muted)">Uma frase dizendo o que dá para explorar aqui.</p>
  <section class="panel">
    <!-- conteúdo interativo -->
  </section>
</div>
<script>
  /* código do applet */
</script>
<!-- botão "Todos os applets" (mantenha esta linha) -->
<script src="../../assets/voltar.js" defer></script>
</body>
</html>
